<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pickea — Picks de fútbol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg: #050505;
    --bg-section: #0A0A0C;
    --card: #0D0E10;
    --active: #131418;
    --line: #25262B;
    --purple: #7C3AED;
    --purple-bright: #8B3DFF;
    --purple-deep: #38106B;
    --text: #FFFFFF;
    --text-dim: #9B9BA3;
    --win: #22C55E;
    --loss: #F43F5E;
    --pending: #FACC15;
    --radius: 18px;
    --radius-lg: 26px;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--text);
    font-family:'Montserrat', -apple-system, sans-serif;
    min-height:100vh;
    line-height:1.45;
    font-weight:400;
  }
  .wrap{ max-width:880px; margin:0 auto; padding:0 0 64px; }
  a{ color:inherit; }
  button:focus-visible, .tab:focus-visible{ outline:2px solid var(--purple-bright); outline-offset:2px; }

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    background:
      radial-gradient(115% 150% at 6% 0%, #8B3DFF 0%, #4C1698 20%, #1B0740 42%, transparent 66%),
      var(--bg);
    padding:28px 20px 24px;
  }
  .hero-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:18px;
    flex-wrap:wrap;
  }
  .brand{
    font-weight:800;
    font-size:clamp(32px, 8vw, 46px);
    letter-spacing:-0.02em;
    line-height:1;
    margin:0;
    color:#FFFFFF;
  }
  .hero-stats{ display:flex; gap:30px; flex-wrap:wrap; }
  .stat-block{ text-align:center; }
  .stat-num{ font-weight:800; font-size:clamp(24px,6vw,34px); color:var(--text); line-height:1; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .stat-label{ color:var(--text-dim); font-size:11px; font-weight:700; letter-spacing:.05em; margin-top:6px; text-transform:uppercase; }

  /* ---------- Tabs ---------- */
  .body-pad{ padding:20px 20px 0; }
  .tabs{ display:flex; gap:22px; flex-wrap:wrap; row-gap:10px; min-height:18px; align-items:center; }
  .tab{
    background:none; border:none; padding:2px 0; cursor:pointer;
    font-family:'Montserrat', sans-serif; font-weight:800; font-size:13.5px;
    letter-spacing:.02em; text-transform:uppercase; color:var(--text-dim);
  }
  .tab.active, .tab:hover{ color:#FFFFFF; }
  .tab.tab-divider{ margin-left:6px; padding-left:20px; border-left:1px solid var(--line); }

  /* ---------- Status states ---------- */
  .status-card{ margin-top:22px; border:1px dashed var(--line); border-radius:var(--radius); padding:22px; color:var(--text-dim); font-size:14px; }
  .status-card.error{ border-color:rgba(244,63,94,.45); color:#F6C6CE; background:rgba(244,63,94,.06); }
  .status-card code{ display:block; margin-top:10px; padding:8px 10px; background:var(--bg); border-radius:6px; color:var(--purple-bright); font-size:12px; word-break:break-all; }
  .status-card button{ margin-top:14px; background:var(--purple); color:#F5F5F5; border:none; padding:9px 16px; border-radius:8px; font-weight:700; cursor:pointer; font-size:13px; }
  .skeleton{ margin-top:22px; display:flex; flex-direction:column; gap:12px; }
  .skeleton .bar{ height:120px; border-radius:var(--radius-lg); background:linear-gradient(90deg, var(--card) 25%, var(--active) 37%, var(--card) 63%); background-size:400% 100%; }
  @media (prefers-reduced-motion:no-preference){ .skeleton .bar{ animation:shimmer 1.4s ease infinite; } @keyframes shimmer{ 0%{background-position:100% 0;} 100%{background-position:0 0;} } }

  /* ---------- Recommended ---------- */
  .recommended{ margin-top:22px; border:1px solid var(--line); border-radius:var(--radius-lg); background:var(--card); padding:20px; }
  .recommended-head{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .recommended-title{ margin:0; font-weight:800; font-size:14px; letter-spacing:.03em; text-transform:uppercase; color:#FFFFFF; }
  .recommended-sub{ color:var(--text-dim); font-size:12px; font-weight:600; }
  .recommended-list{ margin-top:14px; display:flex; flex-direction:column; gap:2px; }
  .rec-row{ display:flex; align-items:center; gap:10px; padding:9px 0; border-top:1px solid var(--line); }
  .rec-row:first-child{ border-top:none; padding-top:0; }
  .rec-teams{ display:flex; align-items:center; gap:6px; font-weight:700; font-size:13px; flex:1; min-width:0; }
  .rec-teams img, .rec-teams .fallback{ width:16px; height:16px; border-radius:50%; object-fit:contain; background:var(--bg-section); flex-shrink:0; }
  .rec-teams .fallback{ display:flex; align-items:center; justify-content:center; font-size:8px; font-weight:800; color:var(--purple-bright); border:1px solid rgba(139,61,255,.4); }
  .rec-teams span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rec-pick{ color:var(--purple-bright); font-weight:700; font-size:12.5px; flex-shrink:0; max-width:42%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:right; }
  .recommended-empty{ margin-top:14px; color:var(--text-dim); font-size:13px; }

  /* ---------- Matches ---------- */
  .match-block{ margin-top:26px; }
  .match-liga{ display:flex; align-items:center; gap:6px; color:var(--text-dim); font-size:11px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; margin-bottom:6px; }
  .match-liga img{ width:14px; height:14px; border-radius:50%; object-fit:contain; }
  .match-title{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:15.5px; letter-spacing:.01em; text-transform:uppercase; color:#FFFFFF; margin:0 0 10px; flex-wrap:wrap; }
  .match-title img, .match-title .fallback{ width:20px; height:20px; border-radius:50%; object-fit:contain; background:var(--bg-section); flex-shrink:0; }
  .match-title .fallback{ display:flex; align-items:center; justify-content:center; font-size:9px; font-weight:800; color:var(--purple-bright); border:1px solid rgba(139,61,255,.4); }
  .match-title .vs{ color:var(--text-dim); font-weight:600; font-size:12px; }
  .match-date{ font-weight:600; color:var(--text-dim); font-size:11px; text-transform:none; letter-spacing:0; margin-left:auto; }

  /* Tarjeta: el color viene directo del logo de cada equipo (difuminado en la esquina),
     así el degradado SIEMPRE coincide con los colores reales del escudo. */
  .ticket{ position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); overflow:hidden; }
  .ticket-glow{ position:absolute; width:240px; height:240px; border-radius:50%; object-fit:cover; filter:blur(38px) saturate(1.6); opacity:.6; pointer-events:none; z-index:0; }
  .ticket-glow.local{ top:-90px; left:-90px; }
  .ticket-glow.visit{ bottom:-90px; right:-90px; }
  .ticket-body{ position:relative; z-index:1; padding:18px 20px; }

  .pick-row{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:8px 0; }
  .pick-row + .pick-row{ border-top:1px solid rgba(255,255,255,.08); }
  .pick-text{ flex:1; min-width:120px; font-size:13.5px; font-weight:700; color:#FFFFFF; text-shadow:0 1px 3px rgba(0,0,0,.55); }
  .pick-text b{ color:var(--purple-bright); font-weight:800; }

  .conf{ display:flex; align-items:center; gap:3px; flex-shrink:0; }
  .conf-chip{ width:7px; height:14px; border-radius:2px; background:rgba(255,255,255,.16); }
  .conf-chip.on{ background:var(--purple-bright); box-shadow:0 0 6px rgba(139,61,255,.6); }
  .conf-word{ font-size:11px; font-weight:800; padding:3px 8px; border-radius:6px; letter-spacing:.2px; flex-shrink:0; }
  .conf-word.alta{ background:rgba(139,61,255,.28); color:#DBC8FF; }
  .conf-word.media{ background:rgba(255,255,255,.18); color:#E7E7EA; }
  .conf-word.baja{ background:rgba(0,0,0,.4); color:#D8D8DC; }

  .stamp{ width:28px; height:28px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0; }
  .stamp svg{ width:15px; height:15px; }
  .stamp.win{ background:rgba(34,197,94,.24); color:#4ADE80; }
  .stamp.loss{ background:rgba(244,63,94,.24); color:#FB7185; }
  .stamp.pending{ background:rgba(250,204,21,.24); color:var(--pending); }

  .empty{ text-align:center; color:var(--text-dim); padding:40px 20px; border:1px dashed var(--line); border-radius:var(--radius); margin-top:22px; font-weight:500; }

  /* ---------- Aciertos ---------- */
  .aciertos-panel{ margin-top:22px; display:flex; flex-direction:column; gap:16px; }
  .acierto-row{ border:1px solid var(--line); border-radius:var(--radius); background:var(--card); padding:16px 18px; }
  .acierto-top{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:10px; }
  .acierto-label{ font-weight:800; font-size:13px; text-transform:uppercase; letter-spacing:.03em; color:#FFFFFF; }
  .acierto-pct{ font-weight:800; font-size:19px; color:var(--purple-bright); font-variant-numeric:tabular-nums; }
  .acierto-track{ height:8px; border-radius:999px; background:var(--active); overflow:hidden; }
  .acierto-fill{ height:100%; border-radius:999px; background:linear-gradient(90deg, var(--purple-deep), var(--purple-bright)); transition:width .5s ease; }
  .acierto-count{ margin-top:8px; font-size:11.5px; color:var(--text-dim); font-weight:600; }


  @media (max-width:520px){
    .hero-stats{ gap:22px; }
    .stat-block{ text-align:left; }
    .match-date{ margin-left:0; flex-basis:100%; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <div class="hero-top">
      <h1 class="brand">PICKEA</h1>
      <div class="hero-stats" id="heroStats">
        <div class="stat-block">
          <div class="stat-num">—</div>
          <div class="stat-label">Acierto</div>
        </div>
        <div class="stat-block">
          <div class="stat-num">—</div>
          <div class="stat-label">Récord (G-P)</div>
        </div>
      </div>
    </div>
  </div>

  <div class="body-pad">
    <nav class="tabs" id="tabs"></nav>
    <div id="content">
      <div class="skeleton">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
    </div>
  </div>

</div>

<script>
/* ============ CONFIG ============
   Apunta esto a tu hoja publicada como CSV.
   Si no carga, ve a tu Google Sheet > Archivo > Compartir > Publicar en la web,
   elige la pestaña PICKS, formato CSV, y pega ese link aquí abajo. */
const SHEET_TAB = 'PICKS';
const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTCf2ovEG2e0udY99gXpg3Ql6WikISim4yaP9QCm6uDJs92XtcBbwD7Epux9gtDkg/pub?gid=1589241387&single=true&output=csv';
const REFRESH_MS = 5 * 60 * 1000; // auto-refresh cada 5 min
const DIAS_VISIBLE_PASADO = 7; // cuántos días después del partido sigue viéndose la tarjeta
/* ================================= */

const contentEl = document.getElementById('content');
const tabsEl = document.getElementById('tabs');
const heroStats = document.getElementById('heroStats').children;

let currentFilter = 'TODO'; // 'TODO' | nombre de liga | 'PASADOS' | 'ACIERTOS'
let lastRows = [];
let lastMatches = [];

function norm(s){ return (s||'').toString().trim().toLowerCase(); }

function mapRow(raw){
  const out = {};
  for(const key in raw){
    const k = norm(key);
    if(k === 'fecha') out.fecha = raw[key];
    else if(k === 'liga') out.liga = raw[key];
    else if(k.includes('logo') && k.includes('liga')) out.logoLiga = raw[key];
    else if(k === 'local') out.local = raw[key];
    else if(k.includes('logo') && k.includes('local')) out.logoLocal = raw[key];
    else if(k === 'visitante') out.visitante = raw[key];
    else if(k.includes('logo') && k.includes('visitante')) out.logoVisitante = raw[key];
    else if(k === 'pick') out.pick = raw[key];
    else if(k === 'confianza') out.confianza = raw[key];
    else if(k === 'resultado') out.resultado = raw[key];
    else if(k === 'tipo' || k === 'mercado' || k === 'categoria') out.tipo = raw[key];
  }
  return out;
}

function parseFecha(str){
  if(!str) return null;
  const s = String(str).trim();

  // Formato ISO AAAA-MM-DD (lo típico al exportar Google Sheets a CSV).
  // OJO: "new Date('2026-09-15')" lo interpreta como UTC y puede mostrar
  // un día antes en zonas horarias negativas, por eso lo armamos a mano
  // con componentes LOCALES.
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m){
    const d = new Date(+m[1], +m[2]-1, +m[3]);
    if(!isNaN(d)) return d;
  }

  // Formato DD/MM/AAAA o DD-MM-AAAA (como suele mostrarse en Sheets en español)
  m = s.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if(m){
    let [,dd,mo,yy] = m;
    if(yy.length===2) yy = '20'+yy;
    const d = new Date(+yy, +mo-1, +dd);
    if(!isNaN(d)) return d;
  }

  // Último recurso: dejar que el navegador lo intente
  const d = new Date(s);
  if(!isNaN(d)) return d;

  return null;
}

function formatFecha(str){
  const d = parseFecha(str);
  if(!d) return str || '';
  return d.toLocaleDateString('es-MX', { weekday:'short', day:'numeric', month:'short' });
}

function startOfToday(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

function isPastMatch(m){
  const d = parseFecha(m.fecha);
  if(!d) return false;
  return d < startOfToday();
}

function isOldMatch(m){
  const d = parseFecha(m.fecha);
  if(!d) return false;
  const cutoff = startOfToday();
  cutoff.setDate(cutoff.getDate() - DIAS_VISIBLE_PASADO);
  return d < cutoff;
}

function resultKind(str){
  const s = norm(str);
  if(!s) return 'pending';
  if(/(gan|win|acert|✔|✅|w\b)/.test(s)) return 'win';
  if(/(perd|lost|fall|✘|❌|l\b)/.test(s)) return 'loss';
  return 'pending';
}

function resultLabel(kind){
  return kind === 'win' ? 'Ganada' : kind === 'loss' ? 'Perdida' : 'Pendiente';
}

function resultIcon(kind){
  if(kind === 'win') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>';
  if(kind === 'loss') return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>';
  return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 16 14"/></svg>';
}

function initials(name){
  return (name||'?').trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
}

function teamLogo(name, logo){
  return logo
    ? `<img src="${logo}" alt="" onerror="this.outerHTML='<span class=&quot;fallback&quot;>${initials(name)}</span>'">`
    : `<span class="fallback">${initials(name)}</span>`;
}

// Color de respaldo (determinístico, no aleatorio) solo para cuando un
// equipo no tiene logo cargado en la hoja.
function hashColor(str){
  const s = str || '?';
  let hash = 0;
  for(let i=0;i<s.length;i++){ hash = s.charCodeAt(i) + ((hash<<5)-hash); }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 45%, 22%)`;
}

// El glow de color de la tarjeta usa DIRECTAMENTE la imagen del logo,
// difuminada con CSS. Así el color siempre es el real del escudo, sin
// depender de leer píxeles del logo (lo cual muchos servidores bloquean
// por seguridad y antes causaba colores incorrectos).
function ticketGlow(side, name, logo){
  if(logo) return `<img class="ticket-glow ${side}" src="${logo}" alt="" loading="lazy" onerror="this.remove()">`;
  return `<span class="ticket-glow ${side}" style="background:${hashColor(name)}"></span>`;
}

function confHtml(raw){
  const s = norm(raw);
  const num = parseFloat(raw);
  if(!isNaN(num) && !/[a-z]/.test(s)){
    const scale = num <= 5 ? 5 : 100;
    const filled = scale === 5 ? Math.round(num) : Math.round(num/20);
    let chips = '';
    for(let i=0;i<5;i++) chips += `<div class="conf-chip ${i<filled?'on':''}"></div>`;
    return `<div class="conf" title="Confianza: ${raw}">${chips}</div>`;
  }
  let cls = 'media', label = raw || 'Media';
  if(/alta|high/.test(s)) cls = 'alta';
  else if(/baja|low/.test(s)) cls = 'baja';
  return `<span class="conf-word ${cls}">${label}</span>`;
}

function confScore(raw){
  const s = norm(raw);
  const num = parseFloat(raw);
  if(!isNaN(num) && !/[a-z]/.test(s)) return num <= 5 ? num*20 : num;
  if(/alta|high/.test(s)) return 90;
  if(/baja|low/.test(s)) return 20;
  return 55;
}

// Clasifica cada pick en una de las 4 categorías de "Aciertos".
// Si en tu hoja agregas una columna "Tipo" (Ganador / Goles totales /
// Tiros de esquina / Ambos anotan) se usa esa directamente; si no,
// se adivina por palabras clave dentro del texto del pick.
function pickCategory(row){
  if(row.tipo){
    const t = norm(row.tipo);
    if(/ambos/.test(t)) return 'Ambos anotan';
    if(/esquina|corner/.test(t)) return 'Tiros de esquina';
    if(/gol/.test(t)) return 'Goles totales';
    if(/gana|ganador|resultado|1x2/.test(t)) return 'Ganador';
  }
  const s = norm(row.pick);
  if(/ambos anotan|ambos marcan|btts/.test(s)) return 'Ambos anotan';
  if(/esquina|corner|c[oó]rner/.test(s)) return 'Tiros de esquina';
  if(/gol(es)?|over|under|m[aá]s de \d|menos de \d/.test(s)) return 'Goles totales';
  return 'Ganador';
}

function renderHero(rows){
  // Siempre usa TODOS los picks históricos, aunque su tarjeta ya no se
  // muestre — el conteo nunca se borra.
  let win=0, loss=0;
  rows.forEach(r=>{
    const k = resultKind(r.resultado);
    if(k==='win') win++; else if(k==='loss') loss++;
  });
  const decided = win+loss;
  const pct = decided ? Math.round((win/decided)*100)+'%' : '—';
  heroStats[0].querySelector('.stat-num').textContent = pct;
  heroStats[1].querySelector('.stat-num').textContent = decided ? `${win}-${loss}` : '—';
}

function buildMatches(rows){
  const map = {}; const order = [];
  rows.forEach(r=>{
    const key = `${r.liga}|${r.fecha}|${r.local}|${r.visitante}`;
    if(!map[key]){
      map[key] = { liga:r.liga||'Sin liga', logoLiga:r.logoLiga, fecha:r.fecha, local:r.local, logoLocal:r.logoLocal, visitante:r.visitante, logoVisitante:r.logoVisitante, picks: [] };
      order.push(key);
    }
    map[key].picks.push(r);
  });
  const matches = order.map(k=>map[k]);
  matches.sort((a,b)=>{
    const da = parseFecha(a.fecha), db = parseFecha(b.fecha);
    if(da && db) return da-db;
    return 0;
  });
  return matches;
}

function uniqueLigas(matches){
  const seen = new Set(); const out = [];
  matches.forEach(m=>{
    if(!seen.has(m.liga)){ seen.add(m.liga); out.push({ name:m.liga, logo:m.logoLiga }); }
  });
  return out;
}

function renderTabs(ligas){
  tabsEl.innerHTML = '';
  const make = (label, value, extraClass)=>{
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab' + (value === currentFilter ? ' active' : '') + (extraClass ? ' '+extraClass : '');
    b.textContent = label;
    b.addEventListener('click', ()=>{
      currentFilter = value;
      tabsEl.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
      b.classList.add('active');
      renderBody();
    });
    tabsEl.appendChild(b);
  };
  make('Todo', 'TODO');
  ligas.forEach(l=> make(l.name, l.name)); // solo ligas con partidos próximos: aparecen y desaparecen solas
  make('Pasados', 'PASADOS', 'tab-divider');
  make('Aciertos', 'ACIERTOS');
}

function renderRecommended(matches){
  const recList = document.getElementById('recList');
  const recEmpty = document.getElementById('recEmpty');
  const recSub = document.getElementById('recSub');
  if(!recList) return;
  // Un solo pick por partido: el de mayor confianza.
  const items = [];
  matches.forEach(m=>{
    let best = null;
    m.picks.forEach(p=>{
      if(resultKind(p.resultado) !== 'pending') return;
      const score = confScore(p.confianza);
      if(!best || score > best.score) best = { m, p, score };
    });
    if(best) items.push(best);
  });
  items.sort((a,b)=> b.score - a.score);
  const top = items.slice(0,4);
  recSub.textContent = items.length ? `${items.length} pendiente${items.length===1?'':'s'}` : '';
  if(!top.length){
    recList.innerHTML = '';
    recEmpty.style.display = 'block';
    return;
  }
  recEmpty.style.display = 'none';
  recList.innerHTML = top.map(({m,p})=>`
    <div class="rec-row">
      <div class="rec-teams">${teamLogo(m.local, m.logoLocal)}<span>${m.local||'—'} vs ${m.visitante||'—'}</span></div>
      <div class="rec-pick">${p.pick || ''}</div>
    </div>
  `).join('');
}

function renderMatchBlock(m, showLiga){
  const picksHtml = m.picks.map(p=>`
    <div class="pick-row">
      <div class="pick-text">${p.pick || 'Sin pick'}</div>
      ${confHtml(p.confianza)}
      <div class="stamp ${resultKind(p.resultado)}" title="${resultLabel(resultKind(p.resultado))}" aria-label="${resultLabel(resultKind(p.resultado))}">${resultIcon(resultKind(p.resultado))}</div>
    </div>
  `).join('');
  return `
    <div class="match-block">
      ${showLiga ? `<div class="match-liga">${m.logoLiga?`<img src="${m.logoLiga}" alt="" onerror="this.style.display='none'">`:''}<span>${m.liga}</span></div>` : ''}
      <div class="match-title">
        ${teamLogo(m.local, m.logoLocal)}<span>${m.local||'—'}</span>
        <span class="vs">VS</span>
        ${teamLogo(m.visitante, m.logoVisitante)}<span>${m.visitante||'—'}</span>
        <span class="match-date">${formatFecha(m.fecha)}</span>
      </div>
      <div class="ticket">
        ${ticketGlow('local', m.local, m.logoLocal)}
        ${ticketGlow('visit', m.visitante, m.logoVisitante)}
        <div class="ticket-body">${picksHtml}</div>
      </div>
    </div>
  `;
}

function fillMatches(list, showLiga, emptyMsg){
  const wrap = document.getElementById('matchesWrap');
  if(!wrap) return;
  if(!list.length){
    wrap.innerHTML = `<div class="empty">${emptyMsg}</div>`;
    return;
  }
  wrap.innerHTML = list.map(m=> renderMatchBlock(m, showLiga)).join('');
}

function computeAciertos(rows){
  const cats = ['Ganador','Goles totales','Tiros de esquina','Ambos anotan'];
  const stats = {}; cats.forEach(c=> stats[c] = { win:0, loss:0 });
  rows.forEach(r=>{
    const kind = resultKind(r.resultado);
    if(kind === 'pending') return;
    const cat = pickCategory(r);
    if(kind === 'win') stats[cat].win++; else stats[cat].loss++;
  });
  return cats.map(c=>{
    const { win, loss } = stats[c];
    const total = win+loss;
    const pct = total ? Math.round((win/total)*100) : null;
    return { label:c, win, loss, total, pct };
  });
}

function renderAciertosHtml(rows){
  const data = computeAciertos(rows);
  const rowsHtml = data.map(d=>`
    <div class="acierto-row">
      <div class="acierto-top">
        <span class="acierto-label">${d.label}</span>
        <span class="acierto-pct">${d.pct===null ? 'Sin datos' : d.pct+'%'}</span>
      </div>
      <div class="acierto-track"><div class="acierto-fill" style="width:${d.pct||0}%"></div></div>
      <div class="acierto-count">${d.total ? `${d.win}-${d.loss} decididos` : 'Aún sin picks decididos en esta categoría'}</div>
    </div>
  `).join('');
  return `<div class="aciertos-panel">${rowsHtml}</div>`;
}

function renderBody(){
  if(currentFilter === 'ACIERTOS'){
    contentEl.innerHTML = renderAciertosHtml(lastRows);
    return;
  }

  if(currentFilter === 'PASADOS'){
    const past = lastMatches.filter(m=> isPastMatch(m) && !isOldMatch(m));
    past.sort((a,b)=>{
      const da = parseFecha(a.fecha), db = parseFecha(b.fecha);
      if(da && db) return db-da; // más reciente primero
      return 0;
    });
    contentEl.innerHTML = `<div id="matchesWrap"></div>`;
    fillMatches(past, true, 'Aún no hay partidos pasados recientes.');
    return;
  }

  // TODO o una liga específica: solo partidos próximos (no pasados)
  const upcoming = lastMatches.filter(m=> !isPastMatch(m));
  const filtered = currentFilter === 'TODO' ? upcoming : upcoming.filter(m=>m.liga === currentFilter);

  contentEl.innerHTML = `
    <div class="recommended">
      <div class="recommended-head">
        <h2 class="recommended-title">Picks recomendados</h2>
        <span class="recommended-sub" id="recSub"></span>
      </div>
      <div class="recommended-list" id="recList"></div>
      <div class="recommended-empty" id="recEmpty">Aún no hay picks recomendados por ahora.</div>
    </div>
    <div id="matchesWrap"></div>
  `;
  renderRecommended(filtered);
  fillMatches(filtered, currentFilter === 'TODO', 'No hay picks para este filtro todavía.');
}

function showEmpty(){
  tabsEl.innerHTML = '';
  contentEl.innerHTML = `<div class="empty">Aún no hay picks en tu hoja. Agrega filas a la pestaña ${SHEET_TAB} y refresca.</div>`;
}

function showError(msg){
  contentEl.innerHTML = `
    <div class="status-card error">
      No pudimos cargar tus picks.<br>${msg}
      <br>Revisa que tu hoja esté publicada como CSV (Archivo → Compartir → Publicar en la web → pestaña ${SHEET_TAB} → CSV) y que el enlace en el código coincida.
      <code>${CSV_URL}</code>
      <button id="retryBtn">Reintentar</button>
    </div>`;
  document.getElementById('retryBtn').addEventListener('click', load);
}

async function load(){
  try{
    const res = await fetch(`${CSV_URL}&_=${Date.now()}`, { cache: 'no-store' });
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const text = await res.text();
    const parsed = Papa.parse(text, { header:true, skipEmptyLines:true });
    const rows = parsed.data.map(mapRow).filter(r=>r.local || r.visitante);
    if(!rows.length){ showEmpty(); return; }

    lastRows = rows;
    renderHero(rows); // conteo histórico completo, nunca se recorta

    const matches = buildMatches(rows);
    lastMatches = matches;

    // Las pestañas de liga solo muestran ligas con partidos próximos:
    // se agregan o quitan solas según lo que se esté por jugar.
    const upcoming = matches.filter(m=> !isPastMatch(m));
    const ligas = uniqueLigas(upcoming);
    const especiales = ['TODO','PASADOS','ACIERTOS'];
    if(!especiales.includes(currentFilter) && !ligas.some(l=>l.name === currentFilter)){
      currentFilter = 'TODO';
    }
    renderTabs(ligas);
    renderBody();
  }catch(err){
    showError(err.message || 'Error desconocido');
  }
}

load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
